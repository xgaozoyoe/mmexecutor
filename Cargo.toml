[package]
name = "mexc-grid-trader"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
anyhow = "1.0"
dotenv = "0.15"
config = "0.14"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
base64 = "0.21"
urlencoding = "2.1"
uuid = { version = "1.6", features = ["v4"] }
